<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mis Gastos</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f3f4f6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Gastos">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    /* Tema claro (por defecto) */
    --bg:#f3f4f6; --panel:#ffffff; --panel2:#eceef1; --border:#d4d8df;
    --text:#1b1e23; --muted:#697086; --accent:#2a2e35; --accent2:#3a4049; --on-accent:#ffffff;
    --hi:#4b5563; --danger:#b3261e; --ok:#1f7a4d; --shadow:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.05);
  }
  html[data-theme="dark"]{
    --bg:#0f1115; --panel:#171a1f; --panel2:#1f242b; --border:#2c323b;
    --text:#e7e9ec; --muted:#969db0; --accent:#e7e9ec; --accent2:#cdd2da; --on-accent:#15171b;
    --hi:#aeb6c4; --danger:#ef5350; --ok:#3ecf8e; --shadow:0 2px 8px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Helvetica Neue",Arial,"Segoe UI",system-ui,sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased}
  .tabular,.gt-item .val,.exp .price .p,.exp .price .iva,.result .big,.card .totals .v{font-variant-numeric:tabular-nums}
  header.top{position:sticky;top:0;z-index:30;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding-top:calc(14px + env(safe-area-inset-top))}
  header.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.3px}
  .tabs{display:flex;gap:6px;margin-left:6px;flex-wrap:wrap}
  .tab{padding:8px 16px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;border:1px solid transparent}
  .tab.active{background:var(--panel2);color:var(--text);border-color:var(--border)}
  .spacer{flex:1}
  .btn{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:10px;cursor:pointer;
    font-weight:600;font-size:14px;transition:.15s}
  .btn:hover{background:var(--accent2)}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn.ghost:hover{background:var(--panel2)}
  .btn.danger{background:var(--danger)}
  .btn.sm{padding:6px 11px;font-size:13px}
  main{padding:22px;max-width:1200px;margin:0 auto}
  .grandtotal{display:flex;gap:26px;align-items:center;background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:18px 24px;margin-bottom:22px;flex-wrap:wrap}
  .gt-item .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
  .gt-item .val{font-size:26px;font-weight:800;margin-top:2px}
  .gt-item .val.iva{color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;
    box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;transition:transform .12s}
  .card:hover{transform:translateY(-3px)}
  .card .photos{height:130px;background:var(--panel2);display:grid;grid-template-columns:1fr 1fr;
    grid-auto-rows:65px;gap:2px;overflow:hidden}
  .card .photos.single{grid-template-columns:1fr}
  .card .photos img{width:100%;height:100%;object-fit:cover}
  .card .photos .empty{grid-column:1/-1;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;height:130px}
  .stripe{padding:14px 16px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:space-between;
    text-shadow:0 1px 2px rgba(0,0,0,.4);font-size:16px}
  .card.nophoto{min-height:128px}
  .card.nophoto .stripe{font-size:17px}
  .card.nophoto .totals{padding:14px 16px}
  .stripe .cnt{font-size:12px;font-weight:600;opacity:.9;background:rgba(0,0,0,.18);padding:2px 8px;border-radius:20px}
  .card .totals{padding:12px 14px}
  .card .totals .row{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0}
  .card .totals .row .k{color:var(--muted);font-size:13px}
  .card .totals .row .v{font-weight:700}
  .card .totals .row .v.iva{color:var(--accent)}
  .addcard{border:2px dashed var(--border);background:transparent;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:8px;color:var(--muted);min-height:200px;cursor:pointer;border-radius:16px;font-weight:600}
  .addcard:hover{border-color:var(--accent);color:var(--accent)}
  .addcard .plus{font-size:34px;line-height:1}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-start;
    justify-content:center;padding:40px 16px;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:18px;width:100%;max-width:560px;
    box-shadow:var(--shadow)}
  .modal.wide{max-width:920px}
  .modal h2{margin:0;padding:20px 24px;border-bottom:1px solid var(--border);font-size:18px;display:flex;
    align-items:center;justify-content:space-between}
  .modal h2 .x{cursor:pointer;color:var(--muted);font-size:22px;line-height:1}
  .modal .body{padding:22px 24px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field input[type=text],.field input[type=number],.field input[type=date],.field input[type=email],.field input[type=password],.field select{width:100%;padding:10px 12px;border-radius:10px;
    border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:15px}
  .field input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);cursor:pointer}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
  .row2{display:flex;gap:14px}
  .row2>*{flex:1}
  .photo-drop{border:2px dashed var(--border);border-radius:12px;padding:18px;text-align:center;color:var(--muted);
    cursor:pointer;background:var(--panel2)}
  .photo-drop:hover{border-color:var(--accent)}
  .photo-drop img{max-height:180px;max-width:100%;border-radius:8px}
  .tagpick{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:5px 12px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);
    color:#fff;user-select:none;display:inline-flex;align-items:center;gap:6px}
  .chip.off{background:var(--panel2)!important;color:var(--muted)}
  .chip .rm{opacity:.7;font-weight:700}
  .modal .foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px}
  .modal .foot .right{display:flex;gap:10px;margin-left:auto}
  .colorrow{display:flex;align-items:center;gap:10px}
  .colorrow input[type=color]{width:46px;height:38px;border:none;background:none;border-radius:8px;cursor:pointer;padding:0}
  /* expense list inside folder */
  .exp-list{display:flex;flex-direction:column;gap:10px}
  .exp{display:flex;gap:14px;align-items:center;background:var(--panel2);border:1px solid var(--border);
    border-radius:12px;padding:10px 12px}
  .exp img,.exp .noimg{width:60px;height:60px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--bg);
    display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px}
  .exp .info{flex:1;min-width:0}
  .exp .info .nm{font-weight:700}
  .exp .info .meta{color:var(--muted);font-size:12px;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .exp .info .meta .t{padding:1px 8px;border-radius:20px;color:#fff;font-size:11px;font-weight:600}
  .exp .price{text-align:right;flex-shrink:0}
  .exp .price .p{font-weight:800;font-size:16px}
  .exp .price .iva{color:var(--accent);font-size:12px;margin-top:2px}
  .exp .acts{display:flex;gap:6px;flex-shrink:0}
  .iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--panel);
    color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px}
  .iconbtn:hover{background:var(--bg)}
  .iconbtn.del:hover{background:var(--danger);border-color:var(--danger);color:#fff}
  .empty-state{text-align:center;color:var(--muted);padding:60px 20px}
  /* reports */
  .report-wrap{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
  @media(max-width:860px){.report-wrap{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px 20px}
  .panel h3{margin:0 0 14px;font-size:15px}
  .seg{display:flex;gap:6px;background:var(--panel2);padding:5px;border-radius:12px;margin-bottom:16px}
  .seg button{flex:1;padding:9px;border:none;background:transparent;color:var(--muted);font-weight:600;
    border-radius:8px;cursor:pointer;font-size:14px}
  .seg button.on{background:var(--accent);color:#fff}
  .daterow{display:flex;gap:12px;align-items:flex-end;margin-bottom:8px;flex-wrap:wrap}
  .daterow .field{margin:0}
  .tagmatch{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 4px}
  .filterbar{margin:10px 0 4px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--panel2)}
  .filterbar .daterow{margin-bottom:6px}
  .filterbar .tagmatch{margin:6px 0 0}
  .needbadge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700;
    background:#f5b53e;color:#3a2c05}
  .searchrow{display:flex;gap:8px;align-items:center;margin:12px 0 4px}
  .search{flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);
    color:var(--text);font-size:14px}
  .search:focus{outline:none;border-color:var(--accent)}
  .sel-tools{display:flex;gap:8px;margin:14px 0 10px;flex-wrap:wrap;align-items:center}
  .sel-list{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
  .sel-item{display:flex;align-items:center;gap:11px;background:var(--panel2);border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;cursor:pointer}
  .sel-item.on{border-color:var(--accent)}
  .sel-item input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
  .sel-item .sw{width:14px;height:14px;border-radius:4px;flex-shrink:0}
  .sel-item .nm{flex:1;font-weight:600}
  .sel-item .sub{color:var(--muted);font-size:12px}
  .result .big{font-size:30px;font-weight:800}
  .result .big.iva{color:var(--accent)}
  .result .rline{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
  .result .rline:last-child{border:none}
  .result .rk{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.5px}
  /* sort + listado */
  .sortbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
  .sortlbl{color:var(--muted);font-size:13px;font-weight:600;margin-right:4px}
  .sortchip{padding:6px 11px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);
    color:var(--muted);cursor:pointer;font-size:13px;font-weight:600}
  .sortchip:hover{color:var(--text)}
  .sortchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .sortchip.flip{margin-left:auto;color:var(--text)}
  .list-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .list-tools .hint{margin:0}
  .exp-check{width:19px;height:19px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;margin-right:2px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .manage-list{display:flex;flex-direction:column;gap:8px}
  .manage-item{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);
    border-radius:10px;padding:8px 12px}
  .manage-item .sw{width:20px;height:20px;border-radius:6px;flex-shrink:0}
  .manage-item .nm{flex:1;font-weight:600}
  .hint{color:var(--muted);font-size:12px;margin-top:4px}
  .p0{color:var(--muted)}
  /* login */
  #login{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
    background:var(--bg);padding:20px}
  #login.show{display:flex}
  .login-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:30px 28px;
    width:100%;max-width:380px;box-shadow:var(--shadow)}
  .login-card h1{margin:0 0 6px;font-size:24px}
  .login-card p.sub{margin:0 0 22px;color:var(--muted);font-size:14px}
  .login-err{color:var(--danger);font-size:13px;min-height:18px;margin:4px 0 10px}
  .login-toggle{text-align:center;margin-top:16px;color:var(--muted);font-size:14px}
  .login-toggle a{color:var(--accent);cursor:pointer;font-weight:600}
  #app{display:none}
  #app.show{display:block}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);
    border:1px solid var(--border);color:var(--text);padding:12px 20px;border-radius:12px;box-shadow:var(--shadow);
    z-index:200;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}

  /* ============ REDISEÑO SOBRIO ============ */
  /* rectángulos en todo */
  *{border-radius:0 !important}
  /* texto sobre acento y resaltado del 19% */
  .btn{background:var(--accent);color:var(--on-accent)}
  .btn:hover{background:var(--accent2)}
  .tab.active{background:var(--accent);color:var(--on-accent)}
  .seg button.on,.sortchip.on,.sel-item input{accent-color:var(--accent)}
  .seg button.on,.sortchip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .gt-item .val.iva,.card .totals .row .v.iva,.exp .price .iva,.result .big.iva{color:var(--hi)}
  .exp-check,.sel-item input{accent-color:var(--accent)}
  /* cabecera: menú a la izquierda, pestañas centradas, acción a la derecha */
  header.top{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;background:var(--panel);
    backdrop-filter:none;align-items:center}
  header.top .brandwrap{justify-self:start;display:flex;align-items:center;gap:10px}
  header.top .rightwrap{justify-self:end;display:flex;align-items:center;gap:8px}
  .menubtn{width:42px;height:42px;border:1px solid var(--border);background:var(--panel);color:var(--text);
    cursor:pointer;display:flex;align-items:center;justify-content:center}
  .menubtn:hover{background:var(--panel2)}
  .tabs{justify-self:center;display:inline-flex;flex-wrap:nowrap;gap:0;margin:0;border:1px solid var(--border);overflow:hidden}
  .tab{padding:10px 20px;border:none;border-right:1px solid var(--border);color:var(--muted);font-weight:600;
    background:var(--panel)}
  .tab:last-child{border-right:none}
  .tab.active{border-color:var(--accent)}
  @media(max-width:680px){
    header.top{display:flex;flex-wrap:wrap;justify-content:space-between}
    .tabs{order:3;width:100%;margin-top:10px;justify-content:center;overflow-x:auto}
    .tab{flex:1;text-align:center;padding:10px 8px}
  }
  /* menú lateral (drawer) */
  .drawer-bd{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none}
  .drawer-bd.show{display:block}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:290px;max-width:86vw;background:var(--panel);
    border-right:1px solid var(--border);z-index:61;transform:translateX(-100%);transition:transform .2s ease;
    display:flex;flex-direction:column}
  .drawer.show{transform:none}
  .drawer-head{display:flex;align-items:center;gap:10px;padding:18px;border-bottom:1px solid var(--border);
    font-weight:700;font-size:16px;padding-top:calc(18px + env(safe-area-inset-top))}
  .drawer-head .x{margin-left:auto;cursor:pointer;color:var(--muted);display:flex}
  .ditem{display:flex;align-items:center;gap:13px;padding:16px 18px;background:none;border:none;
    border-bottom:1px solid var(--border);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;
    text-align:left;width:100%}
  .ditem:hover{background:var(--panel2)}
  .ditem svg{color:var(--muted);flex-shrink:0}
  .brandmark{width:28px;height:28px;background:#F3B94F;display:flex;align-items:center;
    justify-content:center;flex-shrink:0}
  .brandmark svg{display:block}
  /* iconos en botones */
  .iconbtn svg,.menubtn svg{display:block}
  .exp .info .meta svg{vertical-align:-2px}
  .exp{cursor:pointer}
  .exp .acts,.exp .exp-check{cursor:default}
  /* detalle flotante del gasto */
  .det-row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--border)}
  .det-row:last-of-type{border:none}
  .det-row .k{color:var(--muted);font-size:13px}
  .det-row .v{font-weight:700;text-align:right}
  .det-row .v.hi{color:var(--hi)}
  .det-sec{margin-top:18px;font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .det-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px}
  .det-img{position:relative;aspect-ratio:1;border:1px solid var(--border);background:var(--panel2);overflow:hidden}
  .det-img img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
  .det-img .rm{position:absolute;top:5px;right:5px;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff;
    border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .det-img .rm:hover{background:var(--danger)}
  .det-add{aspect-ratio:1;border:2px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px}
  .det-add:hover{border-color:var(--accent);color:var(--accent)}
  .det-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .det-tags .t{padding:2px 9px;color:#fff;font-size:12px;font-weight:600}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:70;display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
  .lightbox.show{display:flex}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain}
  .swatch-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .swatch{width:42px;height:42px;border:1px solid var(--border);cursor:pointer;position:relative}
  .swatch.on{outline:2px solid var(--accent);outline-offset:2px}
  .needbadge{background:var(--hi);color:var(--panel)}
  html[data-theme="dark"] .field input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1)}
  html:not([data-theme="dark"]) .field input[type=date]::-webkit-calendar-picker-indicator{filter:none}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login">
  <div class="login-card">
    <h1 style="display:flex;align-items:center;gap:10px"><span class="brandmark"><svg viewBox="0 0 100 100" width="24" height="24" fill="none"><g transform="translate(-32.4,-30) scale(1.6)" stroke="#fff" stroke-linecap="round"><line x1="33" y1="25" x2="33" y2="75" stroke-width="6"/><path d="M43,25 A25,25 0 0 1 43,75" stroke-width="10"/><line x1="47" y1="42" x2="67" y2="42" stroke-width="8"/><line x1="47" y1="58" x2="67" y2="58" stroke-width="8"/></g></svg></span> Mis Gastos</h1>
    <p class="sub" id="login-sub">Entra para ver tus gastos en todos tus dispositivos.</p>
    <div class="field"><label>Correo</label>
      <input type="email" id="lg-email" placeholder="tucorreo@ejemplo.com" autocomplete="username"></div>
    <div class="field"><label>Contraseña</label>
      <input type="password" id="lg-pass" placeholder="••••••••" autocomplete="current-password"></div>
    <div class="login-err" id="lg-err"></div>
    <button class="btn" style="width:100%" id="lg-btn" onclick="submitAuth()">Entrar</button>
    <div class="login-toggle" id="lg-toggle">
      ¿Primera vez? <a onclick="setAuthMode('signup')">Crear cuenta</a>
    </div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app">
<header class="top">
  <div class="brandwrap">
    <button class="menubtn" onclick="openDrawer()" aria-label="Menú" title="Menú"></button>
  </div>
  <div class="tabs">
    <div class="tab active" data-view="carpetas" onclick="setView('carpetas')">Carpetas</div>

function compressFile(file){return new Promise((res,rej)=>{
  const reader=new FileReader();
  reader.onload=()=>{const img=new Image();
    img.onload=()=>{const max=1200;let w=img.width,h=img.height;
      if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.82));};
    img.onerror=rej;img.src=reader.result;};
  reader.onerror=rej;reader.readAsDataURL(file);});}

async function submitAuth(){

async function loadAll(){
  const [f,t,e]=await Promise.all([
    sb.from('folders').select('*').order('created_at'),
    sb.from('tags').select('*').order('created_at'),
    sb.from('expenses').select('*')
  ]);
  if(f.error) throw f.error; if(t.error) throw t.error; if(e.error) throw e.error;
  folders=(f.data||[]).map(r=>({id:r.id,name:r.name,color:r.color}));
  tags   =(t.data||[]).map(r=>({id:r.id,name:r.name,color:r.color}));
  const all=(e.data||[]).map(r=>{
    let photos=(r.photos||[]).filter(Boolean).map(p=>({path:p,url:pub(p)}));
    if(!photos.length && r.photo_path) photos=[{path:r.photo_path,url:pub(r.photo_path)}];
    return {
      id:r.id,name:r.name,price:Number(r.price),date:r.date,
      folderId:r.folder_id,tagIds:r.tag_ids||[],necesidad:r.necesidad||'prescindible',
      photos,
      createdAt:r.created_at?Number(r.created_at):0,
      deletedAt:r.deleted_at?Date.parse(r.deleted_at):0
    };
  });
  expenses=all.filter(x=>!x.deletedAt);
  trashed=all.filter(x=>x.deletedAt).sort((a,b)=>b.deletedAt-a.deletedAt);
}

    if(error)throw error;

      folder_id:val.folderId,tag_ids:val.tagIds||[],necesidad:val.necesidad||'prescindible',
      photos:(val.photos||[]).map(p=>p.path),created_at:val.createdAt||Date.now()};

    if(error)throw error;
  }
}

let currentFolderId=null,currentTagId=null;
const HI='￿';
function folderNameOf(e){const f=folderById(e.folderId);return f?f.name.toLowerCase():HI;}
function firstTagNameOf(e){const ns=(e.tagIds||[]).map(id=>{const t=tagById(id);return t?t.name.toLowerCase():null;}).filter(Boolean).sort();return ns.length?ns[0]:HI;}
function sortExpenses(list,key,dir){
  const arr=[...list];
  const cmp={
    'fecha-gasto':(a,b)=>expDate(a).localeCompare(expDate(b)),
    'importe':(a,b)=>(parseFloat(a.price)||0)-(parseFloat(b.price)||0),
    'nombre':(a,b)=>(a.name||'').toLowerCase().localeCompare((b.name||'').toLowerCase(),'es'),
    'carpeta':(a,b)=>folderNameOf(a).localeCompare(folderNameOf(b),'es'),
    'etiqueta':(a,b)=>firstTagNameOf(a).localeCompare(firstTagNameOf(b),'es'),
    'fecha-add':(a,b)=>(a.createdAt||0)-(b.createdAt||0),
  }[key]||(()=>0);
  arr.sort((a,b)=>{const r=cmp(a,b);return r!==0?r:expDate(b).localeCompare(expDate(a));});
  if(dir==='desc') arr.reverse();
  return arr;
}
function buildSortBar(ctx){
  const exclude = ctx==='folder'?['carpeta']:ctx==='tag'?['etiqueta']:[];
  const keys=['fecha-gasto','importe','nombre','carpeta','etiqueta','fecha-add'].filter(k=>!exclude.includes(k));
  const s=sortState[ctx];
  return `<div class="sortbar"><span class="sortlbl">Ordenar por:</span>
    ${keys.map(k=>`<button class="sortchip ${s.key===k?'on':''}" onclick="pickSort('${ctx}','${k}')">${SORT_LABELS[k]}${s.key===k?(s.dir==='asc'?' ▲':' ▼'):''}</button>`).join('')}
    <button class="sortchip flip" onclick="flipSort('${ctx}')" title="Invertir el orden actual">⇅ Invertir</button></div>`;
}
function pickSort(ctx,key){const s=sortState[ctx];if(s.key===key){s.dir=s.dir==='asc'?'desc':'asc';}else{s.key=key;s.dir=SORT_DEFAULT_DIR[key];}rerenderSort(ctx);}
function flipSort(ctx){const s=sortState[ctx];s.dir=s.dir==='asc'?'desc':'asc';rerenderSort(ctx);}
function rerenderSort(ctx){if(ctx==='list')render();else if(ctx==='folder')openFolder(currentFolderId);else if(ctx==='tag')openTagView(currentTagId);else renderReports(document.getElementById('grid'));}
function matchesSearch(e,query){
  const q=(query||'').toLowerCase().trim();
  if(!q) return true;
  const f=folderById(e.folderId);
  const tagNames=(e.tagIds||[]).map(id=>{const t=tagById(id);return t?t.name:'';}).join(' ');
  const hay=`${e.name||''} ${f?f.name:''} ${tagNames}`.toLowerCase();
  return q.split(/\s+/).every(term=>hay.includes(term));
}
function filterBySearch(list,query){return list.filter(e=>matchesSearch(e,query));}

/* ---------- Filtros (intervalo de fechas + tipo de gasto) ---------- */
let filters={list:{from:'',to:'',tipo:'todos'},folder:{from:'',to:'',tipo:'todos'},tag:{from:'',to:'',tipo:'todos'}};
function passDate(e,from,to){const d=expDate(e);if(from&&d<from)return false;if(to&&d>to)return false;return true;}
function passTipo(e,tipo){if(!tipo||tipo==='todos')return true;return (e.necesidad||'prescindible')===tipo;}
function applyFilters(list,fl){return list.filter(e=>passDate(e,fl.from,fl.to)&&passTipo(e,fl.tipo));}
function buildFilterBar(ctx){
  const fl=filters[ctx];
  return `<div class="filterbar">
    <div class="daterow">
      <div class="field"><label>Desde</label><input type="date" value="${fl.from}" onchange="setFilter('${ctx}','from',this.value)"></div>
      <div class="field"><label>Hasta</label><input type="date" value="${fl.to}" onchange="setFilter('${ctx}','to',this.value)"></div>
      ${(fl.from||fl.to)?`<button class="btn ghost sm" onclick="clearDateFilter('${ctx}')">Limpiar fechas</button>`:''}
    </div>
    <div class="tagmatch">
      <span class="sortlbl">Tipo:</span>
      <button class="sortchip ${fl.tipo==='todos'?'on':''}" onclick="setFilter('${ctx}','tipo','todos')">Todos</button>
      <button class="sortchip ${fl.tipo==='imprescindible'?'on':''}" onclick="setFilter('${ctx}','tipo','imprescindible')">Imprescindibles</button>
      <button class="sortchip ${fl.tipo==='prescindible'?'on':''}" onclick="setFilter('${ctx}','tipo','prescindible')">Prescindibles</button>
    </div>
  </div>`;
}
function setFilter(ctx,which,val){filters[ctx][which]=val;rerenderSort(ctx);}
function clearDateFilter(ctx){filters[ctx].from='';filters[ctx].to='';rerenderSort(ctx);}

/* ---------- Listado ---------- */
let listSel=new Set(), listSearch='';
function getListadoExpenses(){const s=sortState.list;return sortExpenses(applyFilters(filterBySearch(expenses,listSearch),filters.list),s.key,s.dir);}
function listadoRowsHTML(list){return list.length?list.map(e=>expRowHTML(e,true)).join('')
  :`<div class="empty-state">${listSearch?'Ningún gasto coincide con la búsqueda.':'No hay gastos todavía.'}</div>`;}
function listFiltered(){const fl=filters.list;return !!(listSearch||fl.from||fl.to||fl.tipo!=='todos');}
function listSelInfoText(n){return `${listSel.size} seleccionado(s)${listFiltered()?` · ${n} mostrado(s)`:''}`;}
function renderListado(grid){
  const list=getListadoExpenses();
  grid.innerHTML=`
    <div class="panel" style="margin-bottom:16px">
      ${buildSortBar('list')}
      ${buildFilterBar('list')}
      <div class="searchrow">
        <input type="text" class="search" id="list-search" placeholder="Buscar por nombre, carpeta o etiqueta…" value="${escapeHtml(listSearch)}" oninput="applyListSearch(this.value)">
        ${listSearch?`<button class="btn ghost sm" onclick="clearListSearch()">✕ Limpiar</button>`:''}
      </div>
      <div class="list-tools">
        <span class="hint" id="list-selinfo">${listSelInfoText(list.length)}</span>
        <button class="btn ghost sm" id="list-selall-btn" onclick="listSelectAll()">Seleccionar ${listFiltered()?'resultados':'todo'}</button>
        <button class="btn ghost sm" onclick="listClearSel()">Quitar selección</button>
        <button class="btn sm" id="list-report-btn" onclick="listMakeReport()" ${listSel.size?'':'disabled'}>Crear informe con seleccionados</button>
      </div>
    </div>
    <div class="exp-list" id="listado-rows">${listadoRowsHTML(list)}</div>`;
}
function applyListSearch(val){
  listSearch=val;
  const list=getListadoExpenses();
  const c=document.getElementById('listado-rows');if(c)c.innerHTML=listadoRowsHTML(list);
  const info=document.getElementById('list-selinfo');if(info)info.textContent=listSelInfoText(list.length);
  const b=document.getElementById('list-selall-btn');if(b)b.textContent='Seleccionar '+(listFiltered()?'resultados':'todo');
}
function clearListSearch(){listSearch='';render();}
function toggleListSel(id){
  if(listSel.has(id))listSel.delete(id);else listSel.add(id);
  const info=document.getElementById('list-selinfo');if(info)info.textContent=listSelInfoText(getListadoExpenses().length);
  const btn=document.getElementById('list-report-btn');if(btn)btn.disabled=!listSel.size;
}
function listSelectAll(){getListadoExpenses().forEach(e=>listSel.add(e.id));render();}
function listClearSel(){listSel=new Set();render();}
function listMakeReport(){
  if(!listSel.size)return;
  reportState.mode='gastos';reportState.sel=new Set(listSel);reportState.from='';reportState.to='';
  reportDetailOpen=true;
  setView('informes');
}

/* ---------- Reports ---------- */
let reportState={mode:'carpetas',from:'',to:'',sel:new Set(),tagMatch:'any',search:'',tipo:'todos'};
function inDateRange(e){
  const d=expDate(e);
  if(reportState.from && d < reportState.from) return false;
  if(reportState.to && d > reportState.to) return false;
  if(reportState.tipo && reportState.tipo!=='todos' && (e.necesidad||'prescindible')!==reportState.tipo) return false;
  return true;
}
function reportIncludedExpenses(){
  const base=expenses.filter(inDateRange);
  const s=reportState.sel;
  if(reportState.mode==='carpetas') return base.filter(e=>s.has(e.folderId));
  if(reportState.mode==='etiquetas'){
    if(!s.size) return [];
    if(reportState.tagMatch==='all') return base.filter(e=>[...s].every(t=>(e.tagIds||[]).includes(t)));
    return base.filter(e=>(e.tagIds||[]).some(t=>s.has(t)));
  }
  return base.filter(e=>s.has(e.id));
}
function setReportMode(m){reportState.mode=m;reportState.sel=new Set();reportState.search='';renderReports(document.getElementById('grid'));}
function setTagMatch(v){reportState.tagMatch=v;renderReports(document.getElementById('grid'));}
function setReportTipo(v){reportState.tipo=v;renderReports(document.getElementById('grid'));}
function setReportDate(which,val){reportState[which]=val;renderReports(document.getElementById('grid'));}
function toggleReportSel(id){const s=reportState.sel;s.has(id)?s.delete(id):s.add(id);renderReports(document.getElementById('grid'));}
function reportSelectAll(){reportSelItems().forEach(it=>reportState.sel.add(it.id));renderReports(document.getElementById('grid'));}
function reportClear(){reportState.sel=new Set();renderReports(document.getElementById('grid'));}
function clearReportSearch(){reportState.search='';renderReports(document.getElementById('grid'));}
function applyReportSearch(val){reportState.search=val;const c=document.getElementById('report-sellist');if(c)c.innerHTML=reportItemsHTML();}
function reportGastoList(){const s=sortState.report;return sortExpenses(filterBySearch(expenses.filter(inDateRange),reportState.search),s.key,s.dir);}
function reportSelItems(){
  const m=reportState.mode;
  if(m==='carpetas') return folders.map(f=>{const list=expenses.filter(e=>e.folderId===f.id&&inDateRange(e));
    return {id:f.id,color:f.color,name:f.name,sub:`${list.length} gasto(s) · ${fmt(sumOf(list))}`};});
  if(m==='etiquetas') return tags.map(t=>{const list=expenses.filter(e=>(e.tagIds||[]).includes(t.id)&&inDateRange(e));
    return {id:t.id,color:t.color,name:t.name,sub:`${list.length} gasto(s) · ${fmt(sumOf(list))}`};});
  return reportGastoList().map(e=>{const f=folderById(e.folderId);
    return {id:e.id,color:f?f.color:'#888',name:e.name,sub:`${fmtDate(expDate(e))} · ${f?escapeHtml(f.name):''} · ${fmt(parseFloat(e.price)||0)}`};});
}
function reportItemsHTML(){
  const m=reportState.mode;const items=reportSelItems();
  if(!items.length) return `<div class="hint">No hay ${m==='gastos'?'gastos':m==='carpetas'?'carpetas':'etiquetas'} ${reportState.search?'que coincidan con la búsqueda':'en este rango de fechas'}.</div>`;
  return items.map(it=>{const on=reportState.sel.has(it.id);
    return `<label class="sel-item ${on?'on':''}">
      <input type="checkbox" ${on?'checked':''} onchange="toggleReportSel('${it.id}')">
      <span class="sw" style="background:${it.color}"></span>
      <span class="nm">${escapeHtml(it.name)}</span>
      <span class="sub">${it.sub}</span>
    </label>`;}).join('');
}
function renderReports(grid){
  const m=reportState.mode;
  const inc=reportIncludedExpenses();
  const total=sumOf(inc);
  grid.innerHTML=`<div class="report-wrap">
    <div class="panel">
      <h3>Construir informe</h3>
      <div class="seg">
        <button class="${m==='carpetas'?'on':''}" onclick="setReportMode('carpetas')">Por carpetas</button>
        <button class="${m==='etiquetas'?'on':''}" onclick="setReportMode('etiquetas')">Por etiquetas</button>
        <button class="${m==='gastos'?'on':''}" onclick="setReportMode('gastos')">Por gastos</button>
      </div>
      <div class="daterow">
        <div class="field"><label>Desde</label>
          <input type="date" value="${reportState.from}" onchange="setReportDate('from',this.value)"></div>
        <div class="field"><label>Hasta</label>
          <input type="date" value="${reportState.to}" onchange="setReportDate('to',this.value)"></div>
        ${(reportState.from||reportState.to)?`<button class="btn ghost sm" onclick="setReportDate('from','');setReportDate('to','')">Limpiar fechas</button>`:''}
      </div>
      <div class="hint">Filtra por la fecha en que se realizó el gasto.</div>
      <div class="tagmatch">
        <span class="sortlbl">Tipo:</span>
        <button class="sortchip ${reportState.tipo==='todos'?'on':''}" onclick="setReportTipo('todos')">Todos</button>
        <button class="sortchip ${reportState.tipo==='imprescindible'?'on':''}" onclick="setReportTipo('imprescindible')">Imprescindibles</button>
        <button class="sortchip ${reportState.tipo==='prescindible'?'on':''}" onclick="setReportTipo('prescindible')">Prescindibles</button>
      </div>
      ${m==='etiquetas'?`<div class="tagmatch">
        <span class="sortlbl">Incluir gastos con:</span>
        <button class="sortchip ${reportState.tagMatch==='any'?'on':''}" onclick="setTagMatch('any')">Cualquiera de las etiquetas</button>
        <button class="sortchip ${reportState.tagMatch==='all'?'on':''}" onclick="setTagMatch('all')">Todas las etiquetas</button>
      </div>`:''}
      ${m==='gastos'?`${buildSortBar('report')}
      <div class="searchrow">
        <input type="text" class="search" id="report-search" placeholder="Buscar por nombre, carpeta o etiqueta…" value="${escapeHtml(reportState.search)}" oninput="applyReportSearch(this.value)">
        ${reportState.search?`<button class="btn ghost sm" onclick="clearReportSearch()">✕ Limpiar</button>`:''}
      </div>`:''}
      <div class="sel-tools">
        <button class="btn ghost sm" onclick="reportSelectAll()">Seleccionar ${m==='gastos'&&reportState.search?'resultados':'todo'}</button>
        <button class="btn ghost sm" onclick="reportClear()">Quitar selección</button>
      </div>
      <div class="sel-list" id="report-sellist">${reportItemsHTML()}</div>
    </div>
    <div class="panel result">
      <h3>Resultado del informe</h3>
      <div class="rline"><span class="rk">Seleccionados</span>
        <span>${reportState.sel.size} ${m==='gastos'?'gasto(s)':(m==='carpetas'?'carpeta(s)':'etiqueta(s)')}</span></div>
      <div class="rline"><span class="rk">Nº de gastos</span><span>${inc.length}</span></div>
      <div class="rline"><span class="rk">Suma seleccionada</span><span class="big">${fmt(total)}</span></div>
      <div class="rline"><span class="rk">19%</span><span class="big iva">${fmt(total*IVA)}</span></div>
      ${inc.length?`<div style="margin-top:16px"><button class="btn ghost sm" onclick="toggleReportDetail()">${reportDetailOpen?'Ocultar':'Ver'} gastos incluidos</button></div>
        <div id="report-detail" style="display:${reportDetailOpen?'block':'none'};margin-top:12px">
          <div class="exp-list">${inc.sort((a,b)=>expDate(b).localeCompare(expDate(a))).map(e=>expRowHTML(e)).join('')}</div></div>`:''}
    </div>
  </div>`;
}
let reportDetailOpen=false;
function toggleReportDetail(){reportDetailOpen=!reportDetailOpen;renderReports(document.getElementById('grid'));}

/* ---------- Modal infra ---------- */
function showModal(html){
  document.getElementById('modal-host').innerHTML=html;
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){document.getElementById('overlay').classList.remove('show');document.getElementById('modal-host').innerHTML='';}
document.getElementById('overlay').addEventListener('mousedown',e=>{if(e.target.id==='overlay')closeModal();});
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- Folder create/edit ---------- */
function openFolderEdit(id){
  const f = id ? folderById(id) : {name:'',color:'#4f8cff'};
  showModal(`<div class="modal"><h2>${id?'Editar carpeta':'Nueva carpeta'}<span class="x" onclick="closeModal()">×</span></h2>
    <div class="body">
      <div class="field"><label>Nombre de la carpeta</label>
        <input type="text" id="f-name" value="${escapeHtml(f.name)}" placeholder="p. ej. Supermercado"></div>
      <div class="field"><label>Color de la franja</label>
        <div class="colorrow"><input type="color" id="f-color" value="${f.color}">
        <span class="hint">Este color se mostrará en la franja del cuadrado.</span></div></div>
    </div>
    <div class="foot">
      ${id?`<button class="btn danger" onclick="deleteFolder('${id}')">Eliminar carpeta</button>`:'<span></span>'}
      <div class="right"><button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn" onclick="saveFolder('${id||''}')">Guardar</button></div>
    </div></div>`);
}
async function saveFolder(id){
  const name=document.getElementById('f-name').value.trim();
  const color=document.getElementById('f-color').value;
  if(!name){alert('Ponle un nombre a la carpeta.');return;}
  try{
    if(id){const f=folderById(id);f.name=name;f.color=color;await put('folders',f);}
    else{const f={id:uid(),name,color};folders.push(f);await put('folders',f);}
    closeModal();render();
  }catch(e){alert('No se pudo guardar: '+(e.message||e));}
}
async function deleteFolder(id){
  const list=expensesInFolder(id);
  if(list.length && !confirm(`Esta carpeta tiene ${list.length} gasto(s). Si la eliminas, esos gastos también se borrarán. ¿Continuar?`))return;
  try{
    for(const e of list){for(const p of (e.photos||[]))await removePhoto(p.path);await del('expenses',e.id);}
    expenses=expenses.filter(e=>e.folderId!==id);
    folders=folders.filter(f=>f.id!==id);
    await del('folders',id);
    closeModal();render();
  }catch(e){alert('No se pudo eliminar: '+(e.message||e));}
}

/* ---------- Folder detail ---------- */
function openFolder(fid){
  currentFolderId=fid;
  const f=folderById(fid);const list=sortExpenses(applyFilters(expensesInFolder(fid),filters.folder),sortState.folder.key,sortState.folder.dir);
  const total=sumOf(list);
  showModal(`<div class="modal wide">
    <h2><span><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${f.color};margin-right:8px"></span>${escapeHtml(f.name)}</span>
      <span class="x" onclick="closeModal()">×</span></h2>
    <div class="body">
      <div class="grandtotal" style="margin-bottom:16px">
        <div class="gt-item"><div class="lbl">Total carpeta</div><div class="val">${fmt(total)}</div></div>
        <div class="gt-item"><div class="lbl">19%</div><div class="val iva">${fmt(total*IVA)}</div></div>
        <div class="spacer"></div>
        <button class="btn ghost sm" onclick="openFolderEdit('${fid}')">Editar carpeta</button>
        <button class="btn sm" onclick="openExpense(null,'${fid}')">+ Añadir gasto</button>
      </div>
      ${buildSortBar('folder')}
      ${buildFilterBar('folder')}
      <div class="exp-list">${list.length?list.map(e=>expRowHTML(e)).join(''):'<div class="empty-state">No hay gastos en esta carpeta.</div>'}</div>
    </div></div>`);
}
function expRowHTML(e,selectable){
  const f=folderById(e.folderId);
  const tagsHtml=(e.tagIds||[]).map(id=>{const t=tagById(id);return t?`<span class="t" style="background:${t.color}">${escapeHtml(t.name)}</span>`:'';}).join('');
  const price=parseFloat(e.price)||0;
  const check=selectable?`<input type="checkbox" class="exp-check" ${listSel.has(e.id)?'checked':''} onclick="event.stopPropagation();toggleListSel('${e.id}')">`:'';
  const nImg=(e.photos&&e.photos.length)?` <span class="needbadge" style="background:var(--muted)">${e.photos.length} ${ic('receipt',11)}</span>`:'';
  return `<div class="exp" onclick="openExpenseDetail('${e.id}')" title="Abrir gasto">
    ${check}
    <div class="info"><div class="nm">${escapeHtml(e.name)}</div>
      <div class="meta">${e.date?`${ic('calendar',13)} ${fmtDate(e.date)}`:''} ${f?`${ic('folder',13)} ${escapeHtml(f.name)}`:''} ${e.necesidad==='imprescindible'?'<span class="needbadge">Imprescindible</span>':''} ${tagsHtml}${nImg}</div></div>
    <div class="price"><div class="p">${fmt(price)}</div><div class="iva">+19%: ${fmt(price*IVA)}</div></div>
    <div class="acts">
      <button class="iconbtn" title="Editar" onclick="event.stopPropagation();openExpense('${e.id}')">${ic('edit')}</button>
      <button class="iconbtn del" title="Eliminar" onclick="event.stopPropagation();deleteExpense('${e.id}')">${ic('trash')}</button>
    </div></div>`;
}

/* ---------- Detalle flotante del gasto (info + imágenes) ---------- */
function openExpenseDetail(id){
  const e=expenses.find(x=>x.id===id); if(!e)return;
  const f=folderById(e.folderId);
  const tagsH=(e.tagIds||[]).map(tid=>{const t=tagById(tid);return t?`<span class="t" style="background:${t.color}">${escapeHtml(t.name)}</span>`:'';}).join('')||'<span class="hint">—</span>';
  const price=parseFloat(e.price)||0;
  const imgs=(e.photos||[]).map((p,idx)=>`<div class="det-img"><img src="${p.url}" alt="" onclick="openLightbox('${p.url}')"><button class="rm" title="Quitar imagen" onclick="removeExpenseImage('${id}',${idx})">${ic('close',15)}</button></div>`).join('');
  showModal(`<div class="modal"><h2>${escapeHtml(e.name)}<span class="x" onclick="closeModal()">×</span></h2>
    <div class="body">
      <div class="det-row"><span class="k">Precio</span><span class="v">${fmt(price)}</span></div>
      <div class="det-row"><span class="k">19%</span><span class="v hi">${fmt(price*IVA)}</span></div>
      <div class="det-row"><span class="k">Fecha</span><span class="v">${e.date?fmtDate(e.date):'—'}</span></div>
      <div class="det-row"><span class="k">Carpeta</span><span class="v">${f?escapeHtml(f.name):'—'}</span></div>
      <div class="det-row"><span class="k">Tipo</span><span class="v">${e.necesidad==='imprescindible'?'Imprescindible':'Prescindible'}</span></div>
      <div class="det-row"><span class="k">Etiquetas</span><span class="det-tags">${tagsH}</span></div>
      <div class="det-sec">Imágenes</div>
      <div class="det-imgs" id="det-imgs">
        ${imgs}
        <div class="det-add" onclick="document.getElementById('det-file').click()">${ic('camera',22)}<span>Añadir</span></div>
      </div>
      <input type="file" id="det-file" accept="image/*" multiple style="display:none" onchange="onDetailFiles(event,'${id}')">
    </div>
    <div class="foot"><button class="btn danger" onclick="deleteExpense('${id}')">Eliminar</button>
      <div class="right"><button class="btn ghost" onclick="openExpense('${id}')">Editar datos</button>
      <button class="btn" onclick="closeModal()">Cerrar</button></div></div></div>`);
}
async function onDetailFiles(ev,id){
  const files=[...ev.target.files]; ev.target.value='';
  if(!files.length)return;
  const e=expenses.find(x=>x.id===id); if(!e)return;
  if(!e.photos)e.photos=[];
  toast('Subiendo imagen…');
  try{
    for(const file of files){
      const dataUrl=await compressFile(file);
      const path=await uploadPhoto(dataUrl);
      e.photos.push({path,url:pub(path)});
    }
    await put('expenses',e);
    openExpenseDetail(id); render();
  }catch(ex){alert('No se pudo subir la imagen: '+(ex.message||ex));}
}
async function removeExpenseImage(id,idx){
  const e=expenses.find(x=>x.id===id); if(!e||!e.photos||!e.photos[idx])return;
  if(!confirm('¿Quitar esta imagen del gasto?'))return;
  const p=e.photos[idx];
  try{ await removePhoto(p.path); e.photos.splice(idx,1); await put('expenses',e); openExpenseDetail(id); render(); }
  catch(ex){alert('No se pudo quitar: '+(ex.message||ex));}
}
function openLightbox(url){const lb=document.getElementById('lightbox');lb.querySelector('img').src=url;lb.classList.add('show');}
function closeLightbox(){const lb=document.getElementById('lightbox');lb.classList.remove('show');lb.querySelector('img').src='';}

/* ---------- Tag detail ---------- */
function openTagView(tid){
  currentTagId=tid;
  const t=tagById(tid);const list=sortExpenses(applyFilters(expensesWithTag(tid),filters.tag),sortState.tag.key,sortState.tag.dir);
  const total=sumOf(list);
  showModal(`<div class="modal wide">
    <h2><span><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${t.color};margin-right:8px"></span>Etiqueta: ${escapeHtml(t.name)}</span>
      <span class="x" onclick="closeModal()">×</span></h2>
    <div class="body">
      <div class="grandtotal" style="margin-bottom:16px">
        <div class="gt-item"><div class="lbl">Total etiqueta</div><div class="val">${fmt(total)}</div></div>
        <div class="gt-item"><div class="lbl">19%</div><div class="val iva">${fmt(total*IVA)}</div></div>
      </div>
      ${buildSortBar('tag')}
      ${buildFilterBar('tag')}
      <div class="exp-list">${list.length?list.map(e=>expRowHTML(e)).join(''):'<div class="empty-state">Ningún gasto con esta etiqueta.</div>'}</div>
    </div></div>`);
}

/* ---------- Expense create/edit ---------- */
function openExpense(id,presetFolder){
  const e = id ? expenses.find(x=>x.id===id) : {name:'',price:'',date:'',folderId:presetFolder||(folders[0]&&folders[0].id)||'',tagIds:[],necesidad:'prescindible',photos:[]};
  if(!folders.length){
    showModal(`<div class="modal"><h2>Crea una carpeta primero<span class="x" onclick="closeModal()">×</span></h2>
      <div class="body"><p>Para registrar un gasto necesitas al menos una carpeta donde clasificarlo.</p></div>
      <div class="foot"><div class="right"><button class="btn" onclick="openFolderEdit()">Crear carpeta</button></div></div></div>`);
    return;
  }
  const folderOpts=folders.map(f=>`<option value="${f.id}" ${f.id===e.folderId?'selected':''}>${escapeHtml(f.name)}</option>`).join('');
  const tagChips=tags.map(t=>{const on=(e.tagIds||[]).includes(t.id);
    return `<span class="chip ${on?'':'off'}" style="background:${t.color}" data-tid="${t.id}" onclick="toggleTagChip(this)">${escapeHtml(t.name)}</span>`;}).join('')
    || '<span class="hint">No hay etiquetas. Puedes crearlas en «Gestionar etiquetas».</span>';
  showModal(`<div class="modal"><h2>${id?'Editar gasto':'Nuevo gasto'}<span class="x" onclick="closeModal()">×</span></h2>
    <div class="body">
      <div class="field"><label>Nombre del gasto</label>
        <input type="text" id="e-name" value="${escapeHtml(e.name)}" placeholder="p. ej. Cena restaurante"></div>
      <div class="field"><label>Fecha del gasto</label>
        <input type="date" id="e-date" value="${e.date||''}">
        <div class="hint">Si lo dejas vacío se usará la fecha de hoy (${fmtDate(today())}).</div></div>
      <div class="row2">
        <div class="field"><label>Precio (€)</label>
          <input type="number" id="e-price" step="0.01" min="0" value="${e.price}" placeholder="0,00" oninput="updIva()"></div>
        <div class="field"><label>19%</label>
          <input type="text" id="e-iva" value="${fmt((parseFloat(e.price)||0)*IVA)}" readonly></div>
      </div>
      <div class="field"><label>Carpeta</label><select id="e-folder">${folderOpts}</select></div>
      <div class="field"><label>Tipo de gasto</label>
        <div class="tagmatch" id="e-tipo">
          <button type="button" class="sortchip ${(e.necesidad||'prescindible')==='prescindible'?'on':''}" data-tipo="prescindible" onclick="pickExpTipo(this)">Prescindible</button>
          <button type="button" class="sortchip ${(e.necesidad||'prescindible')==='imprescindible'?'on':''}" data-tipo="imprescindible" onclick="pickExpTipo(this)">Imprescindible</button>
        </div>
        <div class="hint">Por defecto, prescindible.</div></div>
      <div class="field"><label>Etiquetas <span class="hint" style="margin-left:6px;cursor:pointer;color:var(--accent)" onclick="openManageTags()">+ gestionar</span></label>
        <div class="tagpick" id="e-tags">${tagChips}</div></div>
    </div>
    <div class="foot">
      ${id?`<button class="btn danger" onclick="deleteExpense('${id}')">Eliminar</button>`:'<span></span>'}
      <div class="right"><button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn" id="exp-save-btn" onclick="saveExpense('${id||''}')">Guardar</button></div>
    </div></div>`);
}
function updIva(){const p=parseFloat(document.getElementById('e-price').value)||0;
  document.getElementById('e-iva').value=fmt(p*IVA);}
function toggleTagChip(el){el.classList.toggle('off');}
function pickExpTipo(el){el.parentElement.querySelectorAll('.sortchip').forEach(b=>b.classList.remove('on'));el.classList.add('on');}
async function saveExpense(id){
  const name=document.getElementById('e-name').value.trim();
  const price=parseFloat(document.getElementById('e-price').value);
  const date=document.getElementById('e-date').value || today();
  const folderId=document.getElementById('e-folder').value;
  const tagIds=[...document.querySelectorAll('#e-tags .chip:not(.off)')].map(c=>c.dataset.tid);
  const necesidad=document.querySelector('#e-tipo .sortchip.on')?.dataset.tipo||'prescindible';
  if(!name){alert('Ponle un nombre al gasto.');return;}
  if(isNaN(price)||price<0){alert('Introduce un precio válido.');return;}
  const btn=document.getElementById('exp-save-btn');if(btn){btn.disabled=true;btn.textContent='Guardando…';}
  try{
    if(id){const e=expenses.find(x=>x.id===id);Object.assign(e,{name,price,date,folderId,tagIds,necesidad});await put('expenses',e);}
    else{const e={id:uid(),name,price,date,folderId,tagIds,necesidad,photos:[],createdAt:Date.now()};expenses.push(e);await put('expenses',e);}
    closeModal();render();
  }catch(ex){
    if(btn){btn.disabled=false;btn.textContent='Guardar';}
    alert('No se pudo guardar: '+(ex.message||ex));
  }
}
async function deleteExpense(id){
  if(!confirm('¿Enviar este gasto a la papelera? Podrás restaurarlo desde el menú.'))return;
  try{
    const e=expenses.find(x=>x.id===id);
    await setDeleted(id,new Date().toISOString());
    if(e){e.deletedAt=Date.now();trashed.unshift(e);expenses=expenses.filter(x=>x.id!==id);}
    closeModal();render();toast('Movido a la papelera');
  }catch(ex){alert('No se pudo eliminar: '+(ex.message||ex));}
}

/* ---------- Manage tags ---------- */
function openManageTags(){
  const items=tags.map(t=>`<div class="manage-item">
      <span class="sw" style="background:${t.color}"></span>
      <input type="text" class="nm" value="${escapeHtml(t.name)}" style="background:transparent;border:none;color:var(--text);font-weight:600" onchange="renameTag('${t.id}',this.value)">
      <input type="color" value="${t.color}" style="width:34px;height:30px;border:none;background:none;cursor:pointer" onchange="recolorTag('${t.id}',this.value)">
      <button class="iconbtn del" onclick="deleteTag('${t.id}')">${ic('trash')}</button>
    </div>`).join('') || '<div class="hint">Aún no hay etiquetas.</div>';
  showModal(`<div class="modal"><h2>Gestionar etiquetas<span class="x" onclick="closeModal()">×</span></h2>
    <div class="body">
      <div class="manage-list" id="taglist">${items}</div>
      <div class="row2" style="margin-top:16px;align-items:flex-end">
        <div class="field" style="margin:0"><label>Nueva etiqueta</label>
          <input type="text" id="new-tag" placeholder="p. ej. Deducible"></div>
        <div class="field" style="margin:0;flex:0 0 auto"><label>Color</label>
          <input type="color" id="new-tag-color" value="#3ecf8e" style="width:46px;height:38px;border:none;background:none;cursor:pointer"></div>
        <button class="btn" style="flex:0 0 auto" onclick="addTag()">Añadir</button>
      </div>
    </div>
    <div class="foot"><div class="right"><button class="btn" onclick="closeModal()">Listo</button></div></div></div>`);
}
async function addTag(){
  const name=document.getElementById('new-tag').value.trim();
  const color=document.getElementById('new-tag-color').value;
  if(!name)return;
  try{const t={id:uid(),name,color};tags.push(t);await put('tags',t);openManageTags();render();}
  catch(e){alert('No se pudo añadir: '+(e.message||e));}
}
async function renameTag(id,val){const t=tagById(id);if(t){t.name=val.trim()||t.name;await put('tags',t);render();}}
async function recolorTag(id,val){const t=tagById(id);if(t){t.color=val;await put('tags',t);render();}}
async function deleteTag(id){
  if(!confirm('¿Eliminar esta etiqueta? Se quitará de todos los gastos.'))return;
  try{
    for(const e of expenses){if((e.tagIds||[]).includes(id)){e.tagIds=e.tagIds.filter(x=>x!==id);await put('expenses',e);}}
    tags=tags.filter(t=>t.id!==id);await del('tags',id);
    openManageTags();render();
  }catch(ex){alert('No se pudo eliminar: '+(ex.message||ex));}
}

/* ---------- Importar copia de seguridad (migración, un solo uso) ---------- */
const PALETTE=['#4f8cff','#3ecf8e','#ff7d4f','#b86bff','#ff5d8f','#f5b53e','#34c6c6','#7c8cff','#ff5d5d','#8bc34a'];
const norm = s => (s||'').trim().toLowerCase();
async function findOrCreateFolder(name){
  if(!name) name='Sin clasificar';
  let f=folders.find(x=>norm(x.name)===norm(name));
  if(!f){f={id:uid(),name:name.trim(),color:PALETTE[folders.length%PALETTE.length]};folders.push(f);await put('folders',f);}
  return f;
}
async function findOrCreateTag(name){
  let t=tags.find(x=>norm(x.name)===norm(name));
  if(!t){t={id:uid(),name:name.trim(),color:PALETTE[(tags.length+3)%PALETTE.length]};tags.push(t);await put('tags',t);}
  return t;
}
function onImportFile(ev){
  const file=ev.target.files[0]; ev.target.value='';
  if(!file)return;
  const reader=new FileReader();
  reader.onload=async()=>{
    let data;
    try{data=JSON.parse(reader.result);}catch(err){alert('El archivo no es un JSON válido.');return;}
    // Acepta {folders,tags,expenses} (copia completa) o una lista simple de gastos
    let impFolders=[],impTags=[],impExpenses=[];
    if(Array.isArray(data)){impExpenses=data;}
    else{impFolders=data.folders||[];impTags=data.tags||[];impExpenses=data.expenses||data.gastos||[];}
    if(!impExpenses.length && !impFolders.length){alert('No encontré datos para importar.');return;}
    if(!confirm(`Voy a importar ${impFolders.length} carpeta(s), ${impTags.length} etiqueta(s) y ${impExpenses.length} gasto(s) a tu cuenta en la nube. ¿Continuar?`))return;
    toast('Importando… no cierres la ventana');
    let added=0,errors=0;
    const idMapFolder={},idMapTag={};
    try{
      // carpetas (preserva nombre/color; ids nuevos)
      for(const f of impFolders){
        const nf={id:uid(),name:(f.name||'Sin nombre').trim(),color:f.color||PALETTE[folders.length%PALETTE.length]};
        folders.push(nf);await put('folders',nf);idMapFolder[f.id]=nf.id;
      }
      for(const t of impTags){
        const nt={id:uid(),name:(t.name||'etiqueta').trim(),color:t.color||PALETTE[(tags.length+3)%PALETTE.length]};
        tags.push(nt);await put('tags',nt);idMapTag[t.id]=nt.id;
      }
      for(const row of impExpenses){
        try{
          const name=(row.name||'').trim();
          const price=parseFloat(row.price);
          if(!name||isNaN(price)){errors++;continue;}
          // carpeta
          let folderId=idMapFolder[row.folderId];
          if(!folderId){const fr=await findOrCreateFolder(row.folder||row.folderName||row.carpeta);folderId=fr.id;}
          // etiquetas
          let tagIds=[];
          if(Array.isArray(row.tagIds)&&row.tagIds.length){tagIds=row.tagIds.map(x=>idMapTag[x]).filter(Boolean);}
          const tagNames=row.tags||row.tagNames||row.etiquetas||[];
          for(const tn of tagNames){if(tn&&String(tn).trim()){const t=await findOrCreateTag(String(tn));tagIds.push(t.id);}}
          // foto base64 -> storage
          let photos=[];
          if(row.photo && String(row.photo).startsWith('data:')){
            try{const pth=await uploadPhoto(row.photo);photos=[{path:pth,url:pub(pth)}];}catch(e){}
          }
          const e={id:uid(),name,price,date:(row.date||row.fecha||today()),folderId,tagIds,photos,
            createdAt:row.createdAt||Date.now()};
          expenses.push(e);await put('expenses',e);added++;
        }catch(err){errors++;}
      }
      render();
      alert(`Importación terminada:\n• ${added} gasto(s) añadido(s)\n${errors?`• ${errors} con datos incompletos (omitidos)`:''}`);
    }catch(ex){alert('Hubo un problema importando: '+(ex.message||ex));}
  };
  reader.readAsText(file);
}

/* ---------- Boot ---------- */
async function startApp(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){document.getElementById('login').classList.add('show');return;}
  currentUserId=user.id;
  currentUserEmail=user.email||'';
  document.getElementById('login').classList.remove('show');
  document.getElementById('app').classList.add('show');
  try{await loadAll();}catch(e){alert('No se pudieron cargar los datos: '+(e.message||e));}
  render();
}
(async function(){
  applyTheme();
  injectStaticIcons();
  if('serviceWorker' in navigator){try{await navigator.serviceWorker.register('sw.js');}catch(e){}}
  const {data:{session}}=await sb.auth.getSession();
  if(session){await startApp();}
  else{document.getElementById('login').classList.add('show');setAuthMode('login');}
})();
</script>
